<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Play with Ms Ziya</title>
    <style>
      .msz-boot {
        min-height: 100dvh;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: linear-gradient(180deg, #cdefff 0%, #eaf7ff 70%);
      }
      .msz-boot-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        width: min(280px, 100%);
        padding: 28px 24px;
        border-radius: 28px;
        border: 2px solid #cdefff;
        background: #ffffff;
        box-shadow: 0 6px 0 #c9d3e6;
      }
      .msz-boot-dots {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 24px;
      }
      .msz-boot-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        display: inline-block;
        animation: mszBootBounce 0.9s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .msz-boot-dot-1 { background: #0779ba; box-shadow: 0 3px 0 #066399; animation-delay: 0ms; }
      .msz-boot-dot-2 { background: #d6337b; box-shadow: 0 3px 0 #a8245e; animation-delay: 140ms; }
      .msz-boot-dot-3 { background: #ffb020; box-shadow: 0 3px 0 #c98200; animation-delay: 280ms; }
      @keyframes mszBootBounce {
        0%, 80%, 100% { transform: translateY(0); }
        40% { transform: translateY(-9px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .msz-boot-dot { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="msz-boot" role="status" aria-live="polite" aria-label="Menyiapkan">
        <div class="msz-boot-card">
          <div class="msz-boot-dots" aria-hidden="true">
            <span class="msz-boot-dot msz-boot-dot-1"></span>
            <span class="msz-boot-dot msz-boot-dot-2"></span>
            <span class="msz-boot-dot msz-boot-dot-3"></span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
